name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'build.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 允许 Actions 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发冲突
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史，让 build.js 里的 `git log` 注入版本日期在 CI 也可靠
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index.html from src/
        run: node build.js

        - name: Verify artifact
          # 构建没产出 index.html 时立刻失败并给出明确信息，而不是把空产物传上去
          run: |
            test -f index.html || { echo "ERROR: index.html not produced by build.js"; exit 1; }
            echo "index.html built ($(wc -c < index.html) bytes)"

      - name: Stage Pages artifact
        # 放进独立目录再上传：避免单文件上传的边界问题，也确保 .gitignore 里的 index.html 不会被静默排除
        run: mkdir -p _site && cp index.html _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
